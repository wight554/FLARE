# Pinned tuning fixture for the host sync simulation.
#
# The sim suite asserts control-loop behaviour (relief bounds, probe verdicts,
# ramp responsiveness) that only holds at a specific gain. Generating its
# tune.h from the developer's own config.ini made those assertions depend on
# an untracked file: a rig-tuned working copy passed locally while CI — which
# synthesises a config from config.ini.example and gen_config.py defaults —
# failed 12 scenarios for 16 consecutive runs without anyone noticing.
#
# This file is the tuning the simulation validates against. It is tracked, so
# CI and every working copy build the same sim binary. It is deliberately
# minimal: gen_config.py supplies defaults for everything not named here, and
# only knobs the scenario assertions actually depend on belong in this file.
#
# Changing a value here changes what the suite considers correct behaviour —
# it does not change firmware defaults (scripts/gen_config.py) or any real
# device. Keep it in step with the rig-validated tuning it mirrors.

# --- Mandatory: geometry and current (mirrors the CI baseline) ---
microsteps: 16
rotation_distance: 23.0
run_current: 0.8

# --- Knobs the scenario assertions depend on ---

# Proportional gain of the sync loop. Rig-tuned 2026-05-28: kp is insensitive
# once accel is correct, and 2025 mm/min is the practical ceiling. The
# TypePReliefBoundTests bound/responsiveness assertions only hold at this
# gain — at the older 900 the feed reaches max_sps while saturated at tension.
sync_kp_rate: 2025

# Raw lane accel. Rig-tuned for loaded BL follow stability (HW max ~3500).
# Not load-bearing for any current assertion, but pinned so the sim's ramp
# constants stay fixed if a default moves.
global_max_accel: 2500
