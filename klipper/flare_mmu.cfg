# FLARE Klipper MMU integration.
# Copy this file next to printer.cfg and add: [include flare_mmu.cfg]

[gcode_macro _FLARE_VARS]
description: FLARE MMU user variables
variable_dist_sensor_to_extruder: 20.0
# MUST be less than variable_dist_extruder_to_meltzone.
variable_dist_filament_park: 35.0
variable_dist_extruder_to_meltzone: 40.0
variable_tip_length_below_cut: 3.0
variable_load_temp: 230
variable_unload_temp: 185
variable_min_extrude_temp: 180
variable_purge_len: 30.0
variable_purge_speed: 30.0
variable_enable_reload: 1
variable_toolhead_sensor: "toolhead_sensor"
variable_gear_retract_spd: 7800.0
variable_tip_forming_mmu_retract_extra: 30.0
gcode:
    RESPOND MSG="FLARE: _FLARE_VARS holds configuration only"

[gcode_macro _FLARE_TC_STATE]
description: FLARE TC toolhead-sensor gate state
variable_pending: 0
variable_target_lane: 0
variable_poll_interval: 0.5
variable_poll_count: 0
variable_max_polls: 600
gcode:
    RESPOND MSG="FLARE: TC pending={printer['gcode_macro _FLARE_TC_STATE'].pending} target={printer['gcode_macro _FLARE_TC_STATE'].target_lane} polls={printer['gcode_macro _FLARE_TC_STATE'].poll_count}"

[delayed_gcode _FLARE_TC_POLL]
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set s = printer['gcode_macro _FLARE_TC_STATE'] %}
    {% if s.pending|int == 1 %}
        {% set sensor = printer['filament_switch_sensor ' ~ v.toolhead_sensor] %}
        {% if sensor.filament_detected == true %}
            _FLARE_POST_TC_LOAD LANE={s.target_lane|int}
        {% elif s.poll_count|int >= s.max_polls|int %}
            _FLARE_TC_FAILED LANE={s.target_lane|int} REASON=SENSOR_TIMEOUT
        {% else %}
            SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=poll_count VALUE={s.poll_count|int + 1}
            UPDATE_DELAYED_GCODE ID=_FLARE_TC_POLL DURATION={s.poll_interval|float}
        {% endif %}
    {% endif %}

[gcode_macro _FLARE_ARM_TC_LOAD]
description: Arm post-TC hotend loading from the toolhead sensor
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set lane = params.LANE|int %}
    {% set sensor = printer['filament_switch_sensor ' ~ v.toolhead_sensor] %}

    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=pending VALUE=1
    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=target_lane VALUE={lane}
    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=poll_count VALUE=0
    {% if sensor.filament_detected == false %}
        UPDATE_DELAYED_GCODE ID=_FLARE_TC_POLL DURATION={printer['gcode_macro _FLARE_TC_STATE'].poll_interval|float}
    {% endif %}

[gcode_macro _FLARE_ON_TOOLHEAD_RUNOUT]
description: Start post-TC insert polling after old filament leaves toolhead
gcode:
    {% set s = printer['gcode_macro _FLARE_TC_STATE'] %}
    {% if s.pending|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=poll_count VALUE=0
        UPDATE_DELAYED_GCODE ID=_FLARE_TC_POLL DURATION={s.poll_interval|float}
    {% endif %}

[gcode_macro _FLARE_ON_TOOLHEAD_INSERT]
description: Re-check stable insert before post-TC hotend loading
gcode:
    {% set s = printer['gcode_macro _FLARE_TC_STATE'] %}
    {% if s.pending|int == 1 %}
        UPDATE_DELAYED_GCODE ID=_FLARE_TC_POLL DURATION={s.poll_interval|float}
    {% endif %}

[gcode_macro _FLARE_TIP_FORMING_DEFAULTS]
description: FLARE tip forming defaults
variable_pause_push_dist: 0.5
variable_pause_push_speed: 30.0
variable_cooldown_dist: 5.0
variable_cooldown_pull_speed: 70.0
variable_cooldown_pause: 0.0
variable_cooldown_secondary_moves: 0
variable_dip_melt_gap: 0.0
variable_dip_speed: 30.0
variable_dip_pause: 0.0
variable_park_speed: 130.0
gcode:
    RESPOND MSG="FLARE: _FLARE_TIP_FORMING_DEFAULTS holds configuration only"

[delayed_gcode _FLARE_BOOT]
initial_duration: 2
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    RUN_SHELL_COMMAND CMD=flare PARAMS="--timeout 300 SET:RELOAD_MODE:{v.enable_reload}"
    RESPOND MSG="FLARE: RELOAD_MODE set to {v.enable_reload}"

[gcode_macro _FLARE_TIP_FORMING]
description: Form filament tip and park it below the extruder gears
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set defaults = printer['gcode_macro _FLARE_TIP_FORMING_DEFAULTS'] %}
    {% set dist_extruder_to_meltzone = params.DIST_EXTRUDER_TO_MELTZONE|default(v.dist_extruder_to_meltzone)|float %}
    {% set dist_filament_park = params.DIST_FILAMENT_PARK|default(v.dist_filament_park)|float %}
    {% set pause_push_dist = defaults.pause_push_dist|float %}
    {% set pause_push_speed = defaults.pause_push_speed|float %}
    {% set cooldown_dist = defaults.cooldown_dist|float %}
    {% set cooldown_speed = defaults.cooldown_pull_speed|float %}
    {% set cooldown_pause = defaults.cooldown_pause|float %}
    {% set cooldown_secondary_moves = defaults.cooldown_secondary_moves|int %}
    {% set dip_melt_gap = defaults.dip_melt_gap|float %}
    {% set dip_speed = defaults.dip_speed|float %}
    {% set dip_pause = defaults.dip_pause|float %}
    {% set park_speed = defaults.park_speed|float %}
    {% set park_distance = dist_extruder_to_meltzone - dist_filament_park - v.tip_length_below_cut %}
    {% set mmu_tip_retract = dist_extruder_to_meltzone + dist_filament_park + v.tip_length_below_cut + v.tip_forming_mmu_retract_extra %}

    M400
    M83
    G92 E0
    RESPOND MSG="FLARE: tip forming"

    G0 E{pause_push_dist} F{pause_push_speed*60}
    {% set dist_to_meltzone_now = 0 %}

    {% if cooldown_dist > 0 %}
        G0 E-{cooldown_dist} F{cooldown_speed*60}
        G4 P{cooldown_pause*1000}
        {% set dist_to_meltzone_now = cooldown_dist %}

        {% if cooldown_secondary_moves == 1 %}
            G0 E{cooldown_dist*0.5} F{cooldown_speed*60*0.2}
            G0 E-{cooldown_dist*0.25} F{cooldown_speed*60*0.4}
            {% set dist_to_meltzone_now = cooldown_dist*0.75 %}
        {% endif %}
    {% endif %}

    {% if dip_melt_gap > 0 %}
        G0 E{dist_to_meltzone_now-dip_melt_gap} F{dip_speed*60}
        {% set dist_to_meltzone_now = dip_melt_gap %}

        {% if dip_pause > 0 %}
            G0 E{dip_melt_gap*0.5} F{(dip_melt_gap/dip_pause)*60}
            {% set dist_to_meltzone_now = dip_melt_gap*0.5 %}
        {% endif %}
    {% endif %}

    {% if mmu_tip_retract > 0 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="MV:-{mmu_tip_retract}:{park_speed*60*0.2}:I"
    {% endif %}
    G0 E-{park_distance-dist_to_meltzone_now} F{park_speed*60}

[gcode_macro _FLARE_LOAD_HOTEND]
description: Push parked filament through meltzone, then call purge helper
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set push_dist = v.dist_extruder_to_meltzone - v.dist_filament_park - v.tip_length_below_cut %}

    M83
    G0 E{push_dist*0.5} F{v.purge_speed*2*60}
    G0 E{push_dist*0.25} F{v.purge_speed*60}
    G0 E{push_dist*0.25} F{v.purge_speed*0.5*60}

    {% if v.purge_len > 0 %}
        _FLARE_PURGE PURGE={v.purge_len}
    {% endif %}

[gcode_macro _FLARE_PURGE]
description: Purge filament, optionally using a Mini Purge Shute-style park and brush
variable_use_chute: 0
variable_park_x: 0.0
variable_brush_left_x: 0.0
variable_brush_speed: 150.0
variable_brush_cycles: 4
variable_brush_pause_ms: 1000
variable_min_purge: 30.0
variable_max_blob_size: 80.0
variable_fan_speed: -1
variable_retract: 0.4
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set p = printer['gcode_macro _FLARE_PURGE'] %}
    {% set requested = params.PURGE|default(v.purge_len)|float %}
    {% set use_chute = p.use_chute|int %}
    {% set purge = [requested, p.min_purge|float]|max if requested > 0 and use_chute == 1 else requested %}
    {% set max_blob_size = [p.max_blob_size|float, 1.0]|max %}
    {% set purge_cycles = [1, ((purge + max_blob_size - 0.001) // max_blob_size)|int]|max if use_chute == 1 else 1 %}
    {% set has_fan = printer['fan'] is defined %}
    {% set saved_fan_speed = printer['fan'].speed if has_fan else 0 %}

    {% if purge > 0 %}
        SAVE_GCODE_STATE NAME=_flare_purge_state
        M83
        RESPOND MSG="FLARE: purging {purge}mm in {purge_cycles} cycle(s)"

        {% if use_chute == 1 %}
            G90
            # Include your printer-specific purge park macro here, for example:
            # _FLARE_PURGE_PARK
            # Or replace with explicit safe Z/XY moves for your chute.
            G0 X{p.park_x} F{60*p.brush_speed}
        {% endif %}

        {% if has_fan and p.fan_speed|int >= 0 %}
            M106 S{p.fan_speed|int}
        {% endif %}

        {% set ns = namespace(purge_total=purge) %}
        {% for i in range(purge_cycles) %}
            {% set purge_now = [ns.purge_total, max_blob_size]|min if use_chute == 1 else ns.purge_total %}
            G1 E{purge_now} F{v.purge_speed*60}
            {% set ns.purge_total = [0, ns.purge_total - purge_now]|max %}

            {% if use_chute == 1 %}
                G0 E-{p.retract} F{35*60}
                G4 P{p.brush_pause_ms|int}
                {% for brush_i in range(p.brush_cycles|int) %}
                    G0 X{p.brush_left_x} F{60*p.brush_speed}
                    G0 X{p.park_x} F{60*p.brush_speed}
                {% endfor %}
            {% endif %}
        {% endfor %}

        {% if has_fan and p.fan_speed|int >= 0 %}
            M106 S{(saved_fan_speed * 255)|int}
        {% endif %}
        RESTORE_GCODE_STATE NAME=_flare_purge_state
    {% endif %}

[gcode_macro _FLARE_CHANGE_LANE]
description: Change FLARE lane; hotend reload is posted after TC success
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set lane = params.LANE|int %}
    {% set gear_retract = v.dist_filament_park + v.dist_sensor_to_extruder + 5 %}

    M400
    SAVE_GCODE_STATE NAME=_flare_change_state
    M83
    _FLARE_TIP_FORMING
    M400
    _FLARE_ARM_TC_LOAD LANE={lane}
    G1 E-{gear_retract} F{v.gear_retract_spd}
    M400
    RESTORE_GCODE_STATE NAME=_flare_change_state
    RESPOND MSG="FLARE: starting TC:{lane}"
    RUN_SHELL_COMMAND CMD=flare PARAMS="TC:{lane}"

[gcode_macro _FLARE_POST_TC_LOAD]
description: Callback-only hotend reload after successful FLARE TC
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set lane = params.LANE|int %}

    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=target_lane VALUE=0
    UPDATE_DELAYED_GCODE ID=_FLARE_TC_POLL DURATION=0
    SAVE_GCODE_STATE NAME=_flare_post_tc_load_state
    M83
    RESPOND MSG="FLARE: TC:{lane} complete; loading hotend"
    G1 E{v.dist_sensor_to_extruder * 1.2} F{v.purge_speed*60}
    _FLARE_LOAD_HOTEND
    M400
    RESPOND MSG="FLARE: lane {lane} hotend load complete"
    RESTORE_GCODE_STATE NAME=_flare_post_tc_load_state

[gcode_macro _FLARE_TC_FAILED]
description: Callback-only TC failure marker
gcode:
    {% set lane = params.LANE|default(0)|int %}
    {% set reason = params.REASON|default("UNKNOWN") %}

    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=target_lane VALUE=0
    UPDATE_DELAYED_GCODE ID=_FLARE_TC_POLL DURATION=0
    RESPOND TYPE=error MSG="FLARE: TC:{lane} failed ({reason}); hotend load skipped"

[gcode_macro T1]
description: Change to FLARE lane 1
gcode:
    _FLARE_CHANGE_LANE LANE=1

[gcode_macro T2]
description: Change to FLARE lane 2
gcode:
    _FLARE_CHANGE_LANE LANE=2

[gcode_macro FLARE_LOAD]
description: Full load active FLARE lane to toolhead
gcode:
    RUN_SHELL_COMMAND CMD=flare PARAMS="--timeout 300 FL:"

[gcode_macro FLARE_UNLOAD]
description: Unload active FLARE lane from extruder
gcode:
    RUN_SHELL_COMMAND CMD=flare PARAMS="--timeout 300 UL:"

[gcode_macro FLARE_CUT]
description: Perform FLARE cutter cycle
gcode:
    RUN_SHELL_COMMAND CMD=flare PARAMS="--timeout 300 CU:"

[gcode_macro FLARE_TEST_TIP_FORMING]
description: Load hotend, form tip, and retract for manual inspection
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set defaults = printer['gcode_macro _FLARE_TIP_FORMING_DEFAULTS'] %}
    {% set load_dist = v.dist_extruder_to_meltzone * 1.2 %}
    {% set gear_retract = v.dist_filament_park + v.dist_sensor_to_extruder + 5 %}
    {% set pause_push_dist = defaults.pause_push_dist|float %}
    {% set can_extrude = printer[printer.toolhead.extruder].can_extrude if printer.toolhead.extruder != '' else False %}

    {% if can_extrude == True %}
        M83
        G92 E0
        RESPOND MSG="FLARE: loading hotend for tip test"
        G0 E{load_dist/2} F{v.purge_speed*2*60}
        G0 E{load_dist/2} F{v.purge_speed*60}
        G4 P500

        RESPOND MSG="FLARE: simulating print"
        G0 E7 F{4*60}
        G4 P2000
        G1 E-{pause_push_dist} F{35*60}

        _FLARE_TIP_FORMING
        M400
        G1 E-{gear_retract} F7800
        M400
        RESPOND MSG="FLARE: inspect tip"
    {% else %}
        RESPOND TYPE=error MSG="FLARE: heat hotend to at least {v.min_extrude_temp}C"
    {% endif %}
