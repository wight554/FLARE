# FLARE Klipper MMU integration.
# Copy this file next to printer.cfg and add: [include flare_mmu.cfg]
# Distance tuning reference:
# https://github.com/lhndo/LH-Stinger/wiki/Pico-MMU#toolhead-distance-calibration

[gcode_macro _FLARE_VARS]
description: FLARE MMU user variables
variable_dist_sensor_to_extruder: 27.0
variable_dist_sensor_to_synced_move: 8.0
variable_dist_meltzone_to_nozzle_tip: 46.0
# MUST be less than variable_dist_extruder_to_meltzone.
variable_dist_filament_park: 11
variable_dist_extruder_to_meltzone: 44.0
variable_tip_length_below_cut: 3.0
variable_load_temp: 230
variable_unload_temp: 185
variable_min_extrude_temp: 180
variable_purge_len: 30.0
variable_purge_speed: 30.0
variable_enable_reload: 1
variable_toolhead_sensor: "toolhead_sensor"
variable_speed_hub_to_extruder: 50.0
gcode:
    RESPOND MSG="FLARE: _FLARE_VARS holds configuration only"

[gcode_macro _FLARE_TC_STATE]
description: FLARE toolchange tuning (post-load stabilization delay)
variable_load_delay: 2.0
variable_mmu_active: 0
gcode:
    RESPOND MSG="FLARE: TC load_delay={printer['gcode_macro _FLARE_TC_STATE'].load_delay}"

[gcode_macro _FLARE_ON_TOOLHEAD_RUNOUT]
description: Toolhead sensor runout edge handler
gcode:
    {% set s = printer['gcode_macro _FLARE_TC_STATE'] %}
    {% if s.mmu_active == 0 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="TS:0"
    {% endif %}

[gcode_macro _FLARE_ON_TOOLHEAD_INSERT]
description: Mirror the toolhead sensor insert edge to the board (TS:1)
gcode:
    RUN_SHELL_COMMAND CMD=flare PARAMS="TS:1"
    {% if printer.mmu and printer.mmu.bypass %}
        RESPOND MSG="FLARE: Bypass active. Auto-loading filament on toolhead sensor insert."
        MMU_LOAD
    {% endif %}

[gcode_macro _FLARE_TIP_FORMING_DEFAULTS]
description: FLARE tip forming defaults
variable_pause_push_dist: 0.5
variable_pause_push_speed: 10.0
variable_cooldown_dist: 5.0
variable_cooldown_pull_speed: 80.0
variable_cooldown_pause: 0.0
variable_cooldown_secondary_moves: 1
variable_dip_melt_gap: 2.5
variable_dip_speed: 30.0
variable_dip_pause: 3
variable_park_speed: 140.0
gcode:
    RESPOND MSG="FLARE: _FLARE_TIP_FORMING_DEFAULTS holds configuration only"

[gcode_macro _FLARE_SYNC_BOARD]
description: Synchronize toolhead sensor state and reload mode to the board
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    RUN_SHELL_COMMAND CMD=flare PARAMS="SET:RELOAD_MODE:{v.enable_reload}"
    RESPOND MSG="FLARE: RELOAD_MODE set to {v.enable_reload}"
    {% if v.toolhead_sensor and ('filament_switch_sensor ' ~ v.toolhead_sensor) in printer %}
        {% set sensor = printer['filament_switch_sensor ' ~ v.toolhead_sensor] %}
        {% if sensor.filament_detected %}
            RUN_SHELL_COMMAND CMD=flare PARAMS="TS:1"
            RESPOND MSG="FLARE: Toolhead sensor synchronized as DETECTED"
        {% else %}
            RUN_SHELL_COMMAND CMD=flare PARAMS="TS:0"
            RESPOND MSG="FLARE: Toolhead sensor synchronized as EMPTY"
        {% endif %}
    {% else %}
        RESPOND MSG="FLARE: Toolhead sensor '{v.toolhead_sensor}' not configured in printer, skipping TS sync"
    {% endif %}

[delayed_gcode _FLARE_BOOT]
initial_duration: 2
gcode:
    _FLARE_SYNC_BOARD


[gcode_macro _FLARE_TIP_FORMING]
description: Form filament tip and park it below the extruder gears
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set defaults = printer['gcode_macro _FLARE_TIP_FORMING_DEFAULTS'] %}
    {% set dist_extruder_to_meltzone = params.DIST_EXTRUDER_TO_MELTZONE|default(v.dist_extruder_to_meltzone)|float %}
    {% set dist_filament_park = params.DIST_FILAMENT_PARK|default(v.dist_filament_park)|float %}
    {% set pause_push_dist = defaults.pause_push_dist|float %}
    {% set pause_push_speed = defaults.pause_push_speed|float %}
    {% set cooldown_dist = defaults.cooldown_dist|float %}
    {% set cooldown_speed = defaults.cooldown_pull_speed|float %}
    {% set cooldown_pause = defaults.cooldown_pause|float %}
    {% set cooldown_secondary_moves = defaults.cooldown_secondary_moves|int %}
    {% set dip_melt_gap = defaults.dip_melt_gap|float %}
    {% set dip_speed = defaults.dip_speed|float %}
    {% set dip_pause = defaults.dip_pause|float %}
    {% set park_speed = defaults.park_speed|float %}
    {% set park_distance = dist_extruder_to_meltzone - dist_filament_park - v.tip_length_below_cut %}
    {% set mmu_tip_retract = v.dist_sensor_to_extruder + dist_extruder_to_meltzone + v.dist_meltzone_to_nozzle_tip %}

    M400
    M83
    G92 E0
    RESPOND MSG="FLARE: tip forming"

    G0 E{pause_push_dist} F{pause_push_speed*60}
    {% set dist_to_meltzone_now = 0 %}

    {% if cooldown_dist > 0 %}
        G0 E-{cooldown_dist} F{cooldown_speed*60}
        G4 P{cooldown_pause*1000}
        {% set dist_to_meltzone_now = cooldown_dist %}

        {% if cooldown_secondary_moves == 1 %}
            G0 E{cooldown_dist*0.5} F{cooldown_speed*60*0.2}
            G0 E-{cooldown_dist*0.25} F{cooldown_speed*60*0.4}
            {% set dist_to_meltzone_now = cooldown_dist*0.75 %}
        {% endif %}
    {% endif %}

    {% if dip_melt_gap > 0 %}
        G0 E{dist_to_meltzone_now-dip_melt_gap} F{dip_speed*60}
        {% set dist_to_meltzone_now = dip_melt_gap %}

        {% if dip_pause > 0 %}
            G0 E{dip_melt_gap*0.5} F{(dip_melt_gap/dip_pause)*60}
            {% set dist_to_meltzone_now = dip_melt_gap*0.5 %}
        {% endif %}
    {% endif %}

    {% if mmu_tip_retract > 0 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="MV:-{mmu_tip_retract}:{park_speed*60*0.2}:I"
    {% endif %}
    G0 E-{park_distance-dist_to_meltzone_now} F{park_speed*60}

[gcode_macro _FLARE_LOAD_HOTEND]
description: Push parked filament through meltzone, then call purge helper
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set push_dist = v.dist_extruder_to_meltzone - v.dist_filament_park - v.tip_length_below_cut %}

    M83
    G0 E{push_dist*0.5} F{v.purge_speed*2*60}
    G0 E{push_dist*0.25} F{v.purge_speed*60}
    G0 E{push_dist*0.25} F{v.purge_speed*0.5*60}

    {% if v.purge_len > 0 %}
        _FLARE_PURGE PURGE={v.purge_len}
    {% endif %}

[gcode_macro _FLARE_HEAT_HOTEND]
description: Heat hotend for purge/load moves when needed
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set temp = params.TEMP|default(0)|int %}

    {% if temp <= 0 %}
        {% if printer['extruder'].target < v.min_extrude_temp %}
            {% set temp = v.load_temp|int %}
            RESPOND MSG="FLARE: low target temperature; heating hotend to {temp}C"
            M104 S{temp}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp-3} MAXIMUM={temp+3}
        {% endif %}
    {% else %}
        RESPOND MSG="FLARE: heating hotend to {temp}C"
        M104 S{temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp-5} MAXIMUM={temp+5}
    {% endif %}

[gcode_macro _FLARE_PARK]
description: User hook for printer-specific parking
gcode:
    # Add your printer park macro here

[gcode_macro _FLARE_PURGE]
description: Purge filament
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set purge = params.PURGE|default(0)|float %}

    {% if purge > 0 %}
        SAVE_GCODE_STATE NAME=_flare_purge_state
        M83
        _FLARE_PARK
        _FLARE_HEAT_HOTEND
        M400
        RESPOND MSG="FLARE: purging {purge}mm of filament"
        G1 E{purge} F{v.purge_speed*60}
        G0 E-0.4 F{35*60}
        RESTORE_GCODE_STATE NAME=_flare_purge_state
    {% endif %}

[gcode_macro FLARE_UNLOAD_TOOLHEAD]
description: Form filament tip and retract filament past extruder gears
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set sensor = printer['filament_switch_sensor ' ~ v.toolhead_sensor] %}

    _FLARE_CG28
    _FLARE_PARK
    _FLARE_HEAT_HOTEND

    {% if sensor.filament_detected == true %}
        {% set gear_retract = v.dist_filament_park + v.dist_sensor_to_extruder + 5 %}
        SAVE_GCODE_STATE NAME=_flare_unload_toolhead_state
        M83
        _FLARE_TIP_FORMING
        M400
        G1 E-{gear_retract} F{v.speed_hub_to_extruder*60}
        M400
        RUN_SHELL_COMMAND CMD=flare PARAMS="TS:0"
        RESTORE_GCODE_STATE NAME=_flare_unload_toolhead_state
    {% else %}
        RESPOND MSG="FLARE: No filament detected at toolhead sensor, skipping unload retract"
    {% endif %}

[gcode_macro _FLARE_CHANGE_LANE]
description: Change FLARE lane synchronously; blocks until completed
gcode:
    {% set lane = params.LANE|int %}
    {% set s = printer['gcode_macro _FLARE_TC_STATE'] %}
    {% set v = printer['gcode_macro _FLARE_VARS'] %}

    M400

    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=mmu_active VALUE=1
    FLARE_UNLOAD_TOOLHEAD
    RESPOND MSG="FLARE: starting TC:{lane}"
    RUN_SHELL_COMMAND CMD=flare PARAMS="TC:{lane}"

    # Wait synchronously for filament to reach the toolhead sensor
    FLARE_WAIT_TC LANE={lane} LOAD_DELAY={s.load_delay|float}

    # Verify the physical sensor unless the target lane is at pre-gate state
    # (gate_status = 1: IN sensor detected, not past gate).  That is a fresh
    # load from rest; FLARE_WAIT_TC is authoritative and the sensor is empty
    # at render time so the guard would produce a false abort.  Empty lanes
    # have their load button disabled in the UI so gs == 0 cannot reach here.
    # On success, sync the firmware toolhead flag (the sensor's own insert
    # gcode TS:1 is starved behind the gcode lock and may not have fired).
    {% set gs = printer['mmu']['gate_status'] %}
    {% set sensor = printer['filament_switch_sensor ' ~ v.toolhead_sensor] %}
    {% if gs[lane - 1] != 1 and not sensor.filament_detected %}
        { action_raise_error("FLARE: toolchange to lane " ~ lane ~ " failed - no filament at toolhead sensor") }
    {% endif %}
    RUN_SHELL_COMMAND CMD=flare PARAMS="TS:1"

    # Load hotend synchronously
    _FLARE_POST_TC_LOAD LANE={lane}
    UPDATE_DELAYED_GCODE ID=_FLARE_CLEAR_MMU_ACTIVE DURATION=2

[delayed_gcode _FLARE_CLEAR_MMU_ACTIVE]
gcode:
    SET_GCODE_VARIABLE MACRO=_FLARE_TC_STATE VARIABLE=mmu_active VALUE=0

[gcode_macro _FLARE_POST_TC_LOAD]
description: Callback-only hotend reload after successful FLARE TC
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set lane = params.LANE|int %}
    {% set load_park_dist = (v.dist_filament_park + v.dist_sensor_to_synced_move) * 1.1 %}

    SAVE_GCODE_STATE NAME=_flare_post_tc_load_state
    M83
    RESPOND MSG="FLARE: TC:{lane} complete; loading hotend"
    # Stage 1: MMU approach to extruder gears (ignore buffer)
    RUN_SHELL_COMMAND CMD=flare PARAMS="MV:{v.dist_sensor_to_synced_move}:{v.speed_hub_to_extruder * 60}:I"
    # Stage 2: Sync grab and park past extruder gears
    G1 E{load_park_dist} F{v.purge_speed*60}
    _FLARE_LOAD_HOTEND
    M400
    RESPOND MSG="FLARE: lane {lane} hotend load complete"
    RESTORE_GCODE_STATE NAME=_flare_post_tc_load_state

[gcode_macro T1]
description: Change to FLARE lane 1
gcode:
    _FLARE_CHANGE_LANE LANE=1

[gcode_macro T2]
description: Change to FLARE lane 2
gcode:
    _FLARE_CHANGE_LANE LANE=2

[gcode_macro FLARE_LOAD]
description: Full load selected FLARE lane to toolhead
gcode:
    {% set lane = params.LANE|default(0)|int %}
    {% if lane == 0 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="FL:"
    {% elif lane == 1 or lane == 2 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="T:{lane}"
        RUN_SHELL_COMMAND CMD=flare PARAMS="FL:"
    {% else %}
        RESPOND TYPE=error MSG="FLARE: invalid LANE={lane} for FLARE_LOAD"
    {% endif %}

[gcode_macro FLARE_PRELOAD]
description: Preload selected FLARE lane to its gate (OUT), without toolhead load
gcode:
    {% set lane = params.LANE|default(0)|int %}
    {% if lane == 1 or lane == 2 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="T:{lane}"
        RUN_SHELL_COMMAND CMD=flare PARAMS="LO:"
    {% elif lane == 0 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="LO:"
    {% else %}
        RESPOND TYPE=error MSG="FLARE: invalid LANE={lane} for FLARE_PRELOAD"
    {% endif %}

[gcode_macro FLARE_UNLOAD]
description: Unload active FLARE lane from extruder
gcode:
    RUN_SHELL_COMMAND CMD=flare PARAMS="UL:"

[gcode_macro FLARE_EJECT]
description: Eject selected FLARE lane (fully unload gate)
gcode:
    {% set lane = params.LANE|default(0)|int %}
    {% if lane == 0 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="UM:"
    {% elif lane == 1 or lane == 2 %}
        RUN_SHELL_COMMAND CMD=flare PARAMS="UM:{lane}"
    {% else %}
        RESPOND TYPE=error MSG="FLARE: invalid LANE={lane} for FLARE_EJECT"
    {% endif %}

[gcode_macro FLARE_CUT]
description: Perform FLARE cutter cycle
gcode:
    RUN_SHELL_COMMAND CMD=flare PARAMS="CU:"

[gcode_macro FLARE_TEST_TIP_FORMING]
description: Load hotend, form tip, and retract for manual inspection
gcode:
    {% set v = printer['gcode_macro _FLARE_VARS'] %}
    {% set defaults = printer['gcode_macro _FLARE_TIP_FORMING_DEFAULTS'] %}
    {% set load_dist = v.dist_extruder_to_meltzone * 1.2 %}
    {% set pause_retract_dist = params.PAUSE_RETRACT_DIST|default(0.5)|float %}
    {% set pause_push_dist = params.PAUSE_PUSH_DIST|default(defaults.pause_push_dist)|float %}
    {% set pause_push_speed = params.PAUSE_PUSH_SPEED|default(defaults.pause_push_speed)|float %}
    {% set cooldown_dist = params.COOLDOWN_DIST|default(defaults.cooldown_dist)|float %}
    {% set cooldown_speed = params.COOLDOWN_PULL_SPEED|default(defaults.cooldown_pull_speed)|float %}
    {% set cooldown_pause = params.COOLDOWN_PAUSE|default(defaults.cooldown_pause)|float %}
    {% set cooldown_secondary_moves = params.COOLDOWN_SECONDARY_MOVES|default(defaults.cooldown_secondary_moves)|int %}
    {% set dip_melt_gap = params.DIP_MELT_GAP|default(defaults.dip_melt_gap)|float %}
    {% set dip_speed = params.DIP_SPEED|default(defaults.dip_speed)|float %}
    {% set dip_pause = params.DIP_PAUSE|default(defaults.dip_pause)|float %}
    {% set park_speed = params.PARK_SPEED|default(defaults.park_speed)|float %}
    {% set final_unload_distance = params.FINAL_UNLOAD_DISTANCE|default(60.0)|float %}
    {% set final_unload_speed = params.FINAL_UNLOAD_SPEED|default(v.speed_hub_to_extruder)|float %}
    {% set can_extrude = printer[printer.toolhead.extruder].can_extrude if printer.toolhead.extruder != '' else False %}

    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=pause_push_dist VALUE={pause_push_dist}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=pause_push_speed VALUE={pause_push_speed}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=cooldown_dist VALUE={cooldown_dist}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=cooldown_pull_speed VALUE={cooldown_speed}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=cooldown_pause VALUE={cooldown_pause}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=cooldown_secondary_moves VALUE={cooldown_secondary_moves}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=dip_melt_gap VALUE={dip_melt_gap}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=dip_speed VALUE={dip_speed}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=dip_pause VALUE={dip_pause}
    SET_GCODE_VARIABLE MACRO=_FLARE_TIP_FORMING_DEFAULTS VARIABLE=park_speed VALUE={park_speed}

    RESPOND MSG="FLARE: note: push a filament strand against the extruder gears"
    RESPOND MSG="FLARE: starting tip forming test"

    {% if can_extrude == True %}
        M83
        G92 E0
        RESPOND MSG="FLARE: loading hotend for tip test"
        G0 E{load_dist/2} F{v.purge_speed*2*60}
        G0 E{load_dist/2} F{v.purge_speed*60}
        G4 P500

        RESPOND MSG="FLARE: simulating print"
        G0 E7 F{4*60}
        G4 P2000
        G0 E-{pause_retract_dist} F{35*60}

        FLARE_UNLOAD_TOOLHEAD
        RESPOND MSG="FLARE: unloading extruder"
        G4 P1000
        G0 E-{final_unload_distance} F{final_unload_speed*60}
        M400
        RESPOND MSG="FLARE: remove filament gently and inspect tip"
    {% else %}
        RESPOND TYPE=error MSG="FLARE: heat hotend to at least {v.min_extrude_temp}C"
    {% endif %}

[gcode_macro _FLARE_STATE]
description: FLARE daemon state variables mirror
variable_board_online: 0
variable_active_lane: 0
variable_tc_state: "UNKNOWN"
variable_g_buf_pos: 0.0
variable_buf_state: "NEUTRAL"
variable_sps: 0.0
variable_in1: 0
variable_out1: 0
variable_in2: 0
variable_out2: 0
variable_toolhead: 0
variable_y_split: 0
variable_reload_mode: 0
gcode:
    RESPOND MSG="FLARE: State mirror variable store"

[gcode_macro _FLARE_CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[mmu]
# Mock Klipper mmu object for native Mainsail/Fluidd dashboard support.

[mmu_sensors]
# Header is load-bearing: it instantiates mmu_sensors.py, which registers the
# mock filament_switch_sensor objects the Fluidd/Mainsail MMU panel discovers.
# Sensor states are mirrored from the mmu object, not real pins, so no pin
# options are needed (the module defaults any absent pin to 'dummy').
